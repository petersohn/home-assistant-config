homeassistant:
  name: test
  latitude: 47.498358
  longitude: 19.040419
  elevation: 100
  time_zone: Europe/Budapest
  auth_providers:
    - type: homeassistant
  allowlist_external_dirs:
    - /config/notify

http:
  server_port: 18123

api:

websocket_api:

mqtt:
  sensor:
    - name: smoke_sensor
      state_topic: home/test/smoke_sensor/state
    - name: smoke_sensor2
      state_topic: home/test/smoke_sensor2/state
    - name: control_time
      state_topic: home/test/control_time/state
    - name: history_test
      state_topic: home/test/history_test/state
    - name: test_sensor1
      state_topic: home/test/test_sensor1/state
      value_template: "{{ value_json.state }}"
      json_attributes_topic: home/test/test_sensor1/state
      json_attributes_template: '{"foo": "{{ value_json.foo }}"}'
    - name: test_sensor2
      state_topic: home/test/test_sensor2/state
      value_template: "{{ value_json.state }}"
      json_attributes_topic: home/test/test_sensor2/state
      json_attributes_template: '{"foo": "{{ value_json.foo }}"}'
    - name: test_cover_position1
      state_topic: home/test/test_cover_position1/state
    - name: test_cover_position2
      state_topic: home/test/test_cover_position2/state
    - name: cover_available
      state_topic: home/test/cover_available/state
  binary_sensor:
    - name: start
      state_topic: home/test/start/state
      payload_on: "on"
      payload_off: "off"
    - name: control_start
      state_topic: home/test/control_start/state
      payload_on: "on"
      payload_off: "off"
    - name: enabler_switch
      state_topic: home/test/enabler_switch/state
      payload_on: "on"
      payload_off: "off"
  switch:
    - name: control_switch
      command_topic: home/test/control_switch/command
      state_topic: home/test/control_switch/state
      payload_on: "on"
      payload_off: "off"
    - name: test_switch1
      command_topic: home/test/test_switch1/command
      state_topic: home/test/test_switch1/state
      payload_on: "on"
      payload_off: "off"
    - name: test_switch2
      command_topic: home/test/test_switch2/command
      state_topic: home/test/test_switch2/state
      payload_on: "on"
      payload_off: "off"
    - name: test_switch3
      command_topic: home/test/test_switch3/command
      state_topic: home/test/test_switch3/state
      payload_on: "on"
      payload_off: "off"

input_boolean:
  cover_moving:
    initial: false

input_select:
  test_input_select:
    options:
      - "one"
      - "two"
      - "three"
      - "four"
  test_auto_switch_switch1:
    options:
      - "auto"
      - "on"
      - "off"
  test_auto_switch_switch2:
    options:
      - "auto"
      - "on"
      - "off"
  test_cover_mode:
    options:
      - "auto"
      - "stable"
      - "manual"

input_text:
  test_text_1:
  test_text_2:

input_number:
  cover_position:
    min: 0
    max: 100
    initial: 0

template:
  - cover:
      - name: test_cover
        position: "{{ states('input_number.cover_position') }}"
        state: >
          {{
            'opening' if states('input_boolean.cover_moving') == 'on'
            else states('input_number.cover_position') != 0
          }}
        availability: "{{ states('sensor.cover_available') }}"
        open_cover:
          action: script.set_cover_position
          data:
            position: 100
        close_cover:
          action: script.set_cover_position
          data:
            position: 0
        set_cover_position:
          action: script.set_cover_position
          data:
            position: "{{ position }}"

script:
  set_cover_position:
    fields:
      position:
        name: position
    sequence:
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.cover_moving
      - action: input_number.set_value
        data:
          entity_id: input_number.cover_position
          value: "{{ position }}"
      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.cover_moving

command_line:
  - sensor:
      name: log_notifier
      command: "tail -n 1 /config/notify/notify.log"
      scan_interval: 1
  - notify:
      name: test_log_notifier
      command: "cat >> /config/notify/notify.log"

history:

recorder:
