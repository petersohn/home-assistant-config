[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
norecursedirs = ["config", ".hass", ".appdaemon", "output", "test_apps", "test_helpers"]

[tool.mypy]
warn_no_return = true
disallow_untyped_defs = true
disallow_untyped_calls = true
explicit_package_bases = true
mypy_path = [
    "test",
]
files = [
    "home/.homeassistant/appdaemon/apps",
    ".",
]
exclude = [
    "test/appdaemon_integration_test/.appdaemon/",
    "test/appdaemon_integration_test/output/",
    "\\.mypy_cache/",
    "stubs/",
]

[[tool.mypy.overrides]]
module = "appdaemon_unit_test.test_helpers.hass"
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = "appdaemon_unit_test.conftest"
disable_error_code = ["valid-type"]

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
reportImplicitRelativeImport = false
reportUnusedParameter = false
reportUnusedCallResult = false
venvPath = "test/appdaemon_integration_test/"
venv = ".appdaemon"
stubPath = "stubs"
extraPaths = [
    "home/.homeassistant/appdaemon/apps",
    "home/.homeassistant/appdaemon/apps/apps",
    "test",
]
exclude = [
    "test/appdaemon_integration_test/output/",
    "test/appdaemon_integration_test/.appdaemon/",
    "**/.venv/",
    "**/site-packages/",
]

[tool.black]
line-length = 80
